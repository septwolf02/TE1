<!doctype html>
<html lang="vi"><meta charset="utf-8"><title>TE Studio Connector</title>
<style>body{font:14px system-ui;width:320px;padding:12px}button{padding:8px}pre{white-space:pre-wrap}</style>
<body><strong>TE YouTube Studio Connector</strong>
<p>Mở YouTube Studio và menu chuyển kênh, rồi bấm quét. Kênh chỉ có tên sẽ chưa được xác minh ID.</p>
<button id="scan">Quét kênh Studio</button>
<button id="diagnose">Chẩn đoán tên kênh</button>
<div id="manual" hidden><label>Tên kênh đang mở (nhập tay): <input id="manual-name" maxlength="160"></label>
<button id="save-manual">Lưu tên nhập tay</button>
<small>ID lấy từ URL Studio; tên này do bạn cung cấp, chưa được DOM xác minh.</small></div>
<pre id="status">Chưa quét.</pre><pre id="candidates"></pre>
<script src="popup.js"></script></body></html>
