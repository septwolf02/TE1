[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "te-sports-editor"
version = "0.1.0"
description = "Local-first Japanese sports video editor foundation"
requires-python = ">=3.12,<4"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4,<5"]
gui = ["Pillow>=10,<12", "keyring>=25,<27", "PyJWT[crypto]>=2.9,<3"]
publisher = []  # Retain the optional extra name for existing installs; browser automation is disabled.
publisher-probe = ["pywinauto>=0.6.8,<1; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
te = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
